# =============================================================================
# ASA Turbo · docker compose
#
#   Local (stack completa, sem nenhuma chave externa):
#     python3 infra/local/preparar_env.py   # gera .env com COMPOSE_PROFILES=local
#     docker compose up -d --build
#     http://localhost:8080
#
#   Produção (Supabase gerenciado): .env sem o profile "local". Ver infra/deploy/README.md.
#
# Profiles (o padrão, sem profile, sobe app = backend + web/Caddy):
#   local       Postgres 15 + pgvector (imagem Supabase) + PostgREST + GoTrue + gateway + init
#   monitoring  Prometheus + Grafana + node-exporter + cAdvisor (painel e alertas prontos)
# Cada serviço tem limite de CPU e memória (deploy.resources.limits); soma ~4 GB na VM de 8 GB.
# =============================================================================
name: asa-turbo

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-seguranca: &seguranca
  security_opt:
    - no-new-privileges:true

# Limites por serviço (o compose aplica deploy.resources.limits sem Swarm)
x-lim-pequeno: &lim-pequeno
  deploy: { resources: { limits: { cpus: "0.25", memory: 128M } } }
x-lim-medio: &lim-medio
  deploy: { resources: { limits: { cpus: "0.50", memory: 256M } } }

services:
  # ------------------------------------------------------------------ app
  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    image: asa-turbo-backend:0.9.0
    env_file: .env
    environment:
      LOG_DIR: /var/log/asa
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    volumes:
      - logs-backend:/var/log/asa
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
        required: false
    deploy:
      resources:
        limits: { cpus: "${BACKEND_CPUS:-1.5}", memory: 1G }
    <<: [*logs, *seguranca]

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        VITE_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        VITE_API_BASE_URL: /api
    image: asa-turbo-web:0.9.0
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA:-}
      SUPABASE_GW: ${SUPABASE_GW:-supabase-gw:8000}
      MONITOR_USER: ${MONITOR_USER:-monitor}
      MONITOR_HASH: ${MONITOR_HASH:-}
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_PORT_HTTPS:-8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - logs-web:/var/log/caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    <<: [*logs, *seguranca, *lim-medio]

  # ------------------------------------------------------- Supabase local
  db:
    profiles: [local]
    image: supabase/postgres:15.8.1.020
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/local/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    <<: *logs

  gotrue:
    profiles: [local]
    image: supabase/gotrue:v2.164.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_SUPABASE_URL:-http://localhost:8080}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL:-http://localhost:8080}/*
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    <<: [*logs, *lim-medio]

  postgrest:
    profiles: [local]
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # igual ao Supabase gerenciado: uuid-ossp, vector e unaccent vivem no schema extensions
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_POOL: ${PGRST_DB_POOL:-20}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    <<: [*logs, *lim-medio]

  supabase-gw:
    profiles: [local]
    image: caddy:2.8.4-alpine
    volumes:
      - ./infra/local/supabase-gw.Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "8000"
    depends_on:
      - postgrest
      - gotrue
    restart: unless-stopped
    <<: [*logs, *lim-pequeno]

  db-init:
    profiles: [local]
    image: supabase/postgres:15.8.1.020
    entrypoint: ["sh", "/init-db.sh"]
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-AsaTurbo#Demo2026}
    volumes:
      - ./infra/local/init-db.sh:/init-db.sh:ro
      - ./infra/sql:/sql:ro
      - ./seeds:/seeds:ro
    depends_on:
      db:
        condition: service_healthy
      gotrue:
        condition: service_healthy
    restart: "no"
    <<: *lim-medio

  # ------------------------------------------------------- monitoramento
  # COMPOSE_PROFILES=...,monitoring no .env. Nada aqui publica porta para fora:
  #   pelo Caddy, com basic auth:  https://<host>/grafana/  e  https://<host>/prometheus/
  #   por túnel SSH:               ssh -L 3000:127.0.0.1:3000 asa-vm  ->  http://localhost:3000/grafana/
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.external-url=${PUBLIC_URL:-http://localhost:8080}/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-data:/prometheus
      # só leitura, para o docker_sd nomear os containers (rede interna, sem porta publicada)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # node-exporter (rede do host)
    user: "0:0"
    expose:
      - "9090"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }
    <<: [*logs, *seguranca]

  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/snap/.+)($$|/)
    # Rede e PID do host: senão as métricas de rede seriam as do próprio container.
    # Escuta em :9100 do host; o ufw só libera essa porta para as redes do Docker.
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    <<: [*logs, *seguranca, *lim-pequeno]

  cadvisor:
    profiles: [monitoring]
    image: ghcr.io/google/cadvisor:v0.53.0
    # Lê CPU/memória direto dos cgroups (id=/system.slice/docker-<id>.scope). O handler
    # "docker" do cAdvisor fica desligado de propósito (socket inexistente): ele não
    # reconhece containers com o image store do containerd (padrão no Docker 29) e
    # esconderia essas séries. O nome do serviço vem do job docker-nomes do Prometheus.
    command:
      - --docker=unix:///nao/existe.sock
      - --containerd=/nao/existe.sock
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --disable_metrics=disk,diskIO,network,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl,cpuset,advtcp,memory_numa
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
    expose:
      - "8080"
    restart: unless-stopped
    <<: [*logs, *lim-medio]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/asa-turbo.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }
    <<: [*logs, *seguranca]

volumes:
  db-data:
  caddy-data:
  caddy-config:
  logs-backend:
  logs-web:
  prometheus-data:
  grafana-data:
